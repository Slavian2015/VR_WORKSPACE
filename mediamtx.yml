# MediaMTX takes the encoded monitors (RTMP) and the sound (RTSP) from capture.py, on localhost only,
# and serves them to the phone as WebRTC.
logLevel: warn
hls: false
srt: false
moq: false
rtmp: true
rtmpAddress: 127.0.0.1:1935
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
webrtc: true
# Reached through server.js (/whep), which adds HTTPS.
webrtcAddress: 127.0.0.1:8889
# The phone must reach this UDP port on the PC.
webrtcLocalUDPAddress: :8189
# And the same port over TCP: for mobile networks that let no UDP through. (From outside the home the phone also
# needs the PC's address on the internet: server.js passes it as MTX_WEBRTCADDITIONALHOSTS.)
webrtcLocalTCPAddress: :8189

paths:
  # Capture runs only while a viewer of the first monitor is connected. It publishes all the streams below.
  vr/m0:
    runOnDemand: ./capture.py
    runOnDemandRestart: true
  # The phone's microphone, sent by the page while the setting phoneMic is on (WHIP, through server.js): mic.py plays
  # it into the PC's microphone "VR-Headset" for as long as it comes.
  vr/mic:
    runOnReady: ./mic.py
    runOnReadyRestart: true
  # Any number of monitors (how many there are is decided in capture.py) and of single windows (windows.py).
  '~^vr/(m\d+|w\d+|audio)$':
