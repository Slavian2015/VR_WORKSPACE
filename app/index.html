<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Opened from the iPhone home screen the page gets the whole screen: Safari on iPhone has no fullscreen API. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VR Workspace</title>
<link rel="icon" href="assets/favicon.ico">
<!-- Android: added to the home screen, it opens fullscreen in landscape. No start_url: it opens the link it was added
     from, key included (the two links, at home and from outside, become two icons). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  #start { position: fixed; inset: 0; z-index: 1; padding: 24px; border: 0; background: #000c; color: #fff; font: 600 24px system-ui; }
  /* a way to the input test from the start screen: a page started from the home screen has no address bar */
  #inputTest { position: fixed; z-index: 2; left: 0; right: 0; bottom: 16px; text-align: center; color: #9cf; font: 16px system-ui; }
  #trackTest { position: fixed; z-index: 2; left: 0; right: 0; bottom: 48px; text-align: center; color: #9cf; font: 16px system-ui; }
  #start[hidden] ~ #inputTest, #start[hidden] ~ #trackTest { display: none; }
  /* over the picture, which is not drawn meanwhile */
  #sensor { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; background: #000; color: #555; font: 16px system-ui; }
  #sensor[hidden] { display: none; }
</style>
<button id="start">Нажмите, чтобы начать</button>
<a id="inputTest" href="input-test.html">Проверка мыши и клавиатуры</a>
<a id="trackTest" href="track-test.html">Проверка движения головы</a>
<div id="sensor" hidden>Телефон работает как датчик шлема на кабеле</div>
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<script type="module" src="main.js"></script>
