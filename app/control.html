<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Workspace: настройки</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root { color-scheme: light dark; }
  body { font: 15px system-ui; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  label { display: grid; grid-template-columns: 1fr 5em; gap: 4px 12px; margin: 14px 0; }
  label input, label select { grid-row: 2; grid-column: 1 / -1; width: 100%; }
  label.check { display: block; }
  label.check input { width: auto; margin-right: 6px; }
  output { grid-row: 1; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 12px; margin: 0 8px 8px 0; }
  fieldset, details { margin: 16px 0; }
  legend, summary { font-weight: 600; }
  summary { cursor: pointer; }
</style>
<h1>VR Workspace</h1>
<p id="status" role="status">Связь с сервером…</p>

<button id="center">Центрировать по взгляду</button>
<p>Посмотрите туда, где должен быть центр расстановки, и нажмите кнопку. Когда она в фокусе, работает и пробел: можно смотреть в сторону от этого окна.</p>

<label>Фон 360 <select id="bg"><option value="black">чёрный</option></select></label>
<label class="check"><input id="autoBlack" type="checkbox">Чёрный фон, пока какое-нибудь окно развёрнуто на весь экран</label>
<label class="check"><input id="hideMonitors" type="checkbox">Скрыть мониторы (чтобы рассмотреть фон, например тестовую сетку)</label>
<label class="check"><input id="camera" type="checkbox">Держать камеру телефона включённой (телефон спросит разрешение, пока он в руках)</label>
<button id="passthrough">Фон с камеры телефона: включить</button>
<div id="layout"></div>
<label>Виртуальных мониторов <input id="virtual" type="number" min="0" step="1" required></label>
<label>Размер виртуальных мониторов, точек <select id="virtualSize"></select></label>
<div id="monitors"></div>
<button id="resetLayout">Сбросить расстановку</button>

<details>
  <summary>Калибровка линз</summary>
  <div id="lens"></div>
  <button id="resetLens">Сбросить калибровку</button>
</details>

<script type="module">
  import { LAYOUT_SPEC, MONITOR_SPEC, LENS_SPEC, watchParams, setParams } from './params.js'

  const $ = id => document.getElementById(id)
  const sliders = {} // settings key -> { input, output }
  function addSlider(parent, key, [, min, max, step, text]) {
    const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step })
    const output = document.createElement('output')
    input.oninput = () => { output.textContent = input.value; setParams({ [key]: +input.value }) }
    const label = document.createElement('label')
    label.append(text, input, output) // the slider first: a label names its first control, and the number is one too
    parent.append(label)
    sliders[key] = { input, output }
  }
  const reset = keys => setParams(Object.fromEntries(keys.map(key => [key, null])))
  const monitorKeys = () => Object.keys(sliders).filter(key => /^m\d+\./.test(key))

  for (const [key, spec] of Object.entries(LAYOUT_SPEC)) addSlider($('layout'), key, spec)
  for (const [key, spec] of Object.entries(LENS_SPEC)) addSlider($('lens'), key, spec)
  $('resetLens').onclick = () => reset(Object.keys(LENS_SPEC))
  $('resetLayout').onclick = () => reset([...Object.keys(LAYOUT_SPEC), ...monitorKeys()])
  $('center').onclick = () => setParams({ recenter: Date.now() })

  // Everything in app/bg is offered: setup.sh puts photos there, a 360 video dropped in works too.
  const files = await (await fetch('/bgs')).json()
  $('bg').append(...files.map(file => new Option(file.replace(/^bg\/|\.\w+$/g, ''), file)))
  $('bg').onchange = () => setParams({ bg: $('bg').value })
  $('autoBlack').onchange = () => setParams({ autoBlack: $('autoBlack').checked })
  $('camera').onchange = () => setParams({ camera: $('camera').checked })
  $('hideMonitors').onchange = () => setParams({ hideMonitors: $('hideMonitors').checked })
  $('passthrough').onclick = () => fetch('/toggle/passthrough', { method: 'POST' })
  $('virtual').onchange = () => $('virtual').reportValidity() && setParams({ virtual: +$('virtual').value })
  $('virtualSize').onchange = () => setParams({ virtualSize: $('virtualSize').value })

  let shown // the monitors the page has controls for
  watchParams(p => {
    const monitors = JSON.stringify(p.monitors)
    if (monitors !== shown) { // at start, and when the number of virtual monitors was changed
      shown = monitors
      for (const key of monitorKeys()) delete sliders[key]
      $('monitors').replaceChildren(...p.monitors.map(({ id, name }, i) => {
        const box = document.createElement('fieldset')
        box.append(Object.assign(document.createElement('legend'), { textContent: `Монитор ${i + 1} (${name})` }))
        for (const [key, spec] of Object.entries(MONITOR_SPEC)) addSlider(box, `${id}.${key}`, spec)
        return box
      }))
      $('virtual').value = p.monitors.filter(m => m.virtual).length
      $('virtual').max = p.maxVirtual
      $('virtualSize').replaceChildren(...p.virtualSizes.map(size => new Option(size.replace('x', ' × '), size)))
    }
    // The control being used keeps its own value: an answer that was already on its way would pull it back.
    for (const [key, { input, output }] of Object.entries(sliders)) {
      if (input !== document.activeElement) input.value = p[key]
      output.textContent = input.value
    }
    if ($('bg') !== document.activeElement) $('bg').value = p.bg
    if ($('virtualSize') !== document.activeElement) $('virtualSize').value = p.virtualSize
    $('autoBlack').checked = p.autoBlack
    $('camera').checked = p.camera
    $('hideMonitors').checked = p.hideMonitors
    $('passthrough').textContent = `Фон с камеры телефона: ${p.passthrough ? 'выключить' : 'включить'}`
    $('passthrough').disabled = !p.camera
    $('status').textContent = p.phoneOnline
      ? 'Телефон на связи: изменения видны в шлеме сразу.'
      : 'Телефон не подключён: настройки применятся, когда он подключится.'
  }, () => $('status').textContent = 'Нет связи с сервером: изменения не сохраняются.')
</script>
